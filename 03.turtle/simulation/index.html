<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./logo_se.png" />
  <title>Turtle Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
  <style>
    :root {
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #153243;
      background: linear-gradient(180deg, #f8fbff 0%, #eaf4f1 100%);
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      display: grid;
      grid-template-columns: minmax(360px, 1.2fr) minmax(320px, 0.8fr);
      gap: 20px;
      padding: 20px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(21, 50, 67, 0.12);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(21, 50, 67, 0.08);
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 18px 10px;
    }

    .panel-header h1,
    .panel-header h2 {
      margin: 0;
    }

    .panel-header p {
      margin: 6px 0 0;
      color: #46606d;
    }

    .controls {
      display: flex;
      gap: 12px;
      padding: 0 18px 18px;
    }

    .code-panel {
      padding: 0 18px 18px;
    }

    #codeOutput {
      min-height: 360px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      background: #14866d;
      color: #ffffff;
    }

    button.secondary {
      background: #153243;
    }

    #simulatorCanvas {
      display: block;
      width: calc(100% - 36px);
      margin: 0 18px 18px;
      border-radius: 12px;
      border: 1px solid rgba(21, 50, 67, 0.18);
      background: #ffffff;
    }

    /* ── Editor bar ── */
    .editor-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .editor-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #14866d;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .editor-label-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #14866d;
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .2;
      }
    }

    .btn-sync {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: transparent;
      color: #46606d;
      border: 1px solid rgba(21, 50, 67, .2);
      cursor: pointer;
      transition: background .15s;
    }

    .btn-sync:hover {
      background: rgba(21, 50, 67, .07);
    }

    /* ── CodeMirror overrides ── */
    .CodeMirror {
      background: #0f1f2b !important;
      border-radius: 12px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.65;
      height: 360px;
      border: 1px solid rgba(255, 255, 255, .06);
      /* dracula theme handles all token colours */
    }

    .CodeMirror-scroll {
      max-height: 360px;
      overflow: auto;
    }

    /* gutter (line numbers) */
    .CodeMirror-gutters {
      background: #0a1720 !important;
      border-right: 1px solid rgba(255, 255, 255, .06) !important;
      border-radius: 12px 0 0 12px;
    }

    .CodeMirror-linenumber {
      color: rgba(255, 255, 255, .22) !important;
      padding: 0 10px 0 6px;
    }

    /* active line highlight */
    .CodeMirror-activeline-background {
      background: rgba(255, 255, 255, .04) !important;
    }

    /* focus ring */
    .CodeMirror-focused {
      outline: none;
      box-shadow: 0 0 0 2px rgba(20, 134, 109, .5);
      border-radius: 12px;
    }

    /* cursor */
    .CodeMirror-cursor {
      border-left-color: #14866d !important;
    }

    /* selection */
    .CodeMirror-selected {
      background: rgba(20, 134, 109, .28) !important;
    }

    .CodeMirror-focused .CodeMirror-selected {
      background: rgba(20, 134, 109, .38) !important;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script type="module" crossorigin src="./assets/index-Bu44aixs.js"></script>
</head>

<body>
  <main>
    <section class="panel">
      <div class="panel-header">
        <h1>Turtle Workspace</h1>
        <p>Paste your generated JavaScript code here.</p>
      </div>
      <div id="blocklyDiv"></div>
      <div class="code-panel">
        <div id="codeOutput"></div>
      </div>
      <div class="controls">
        <button id="runBtn">Run Program</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Simulator</h2>
        <!-- <p>The turtle starts in the center, facing right, drawing a black trail when the pen is down.</p> -->
      </div>
      <canvas id="simulatorCanvas" width="480" height="480"></canvas>
    </section>
  </main>

</body>

</html>
